name: Build and Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version, e.g. 0.1.0'
        required: true
        default: '0.1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Vue plugin
        working-directory: page
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          npm install
          npm run build

      - name: Create package structure
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          PKG_NAME="msedit-${VERSION}-1+mos-plugin"
          PKG_DIR="${PKG_NAME}_all"

          mkdir -p ${PKG_DIR}/usr/bin/plugins
          mkdir -p ${PKG_DIR}/usr/share/msedit-plugin
          mkdir -p ${PKG_DIR}/var/www/mos-plugins/msedit
          mkdir -p ${PKG_DIR}/DEBIAN

          cp msedit-backend ${PKG_DIR}/usr/bin/plugins/msedit
          chmod 0755 ${PKG_DIR}/usr/bin/plugins/msedit
          cp msedit-wrapper ${PKG_DIR}/usr/bin/msedit
          chmod 0755 ${PKG_DIR}/usr/bin/msedit

          cp msedit-backend ${PKG_DIR}/usr/share/msedit-plugin/
          cp msedit-wrapper ${PKG_DIR}/usr/share/msedit-plugin/
          cp functions settings.json ${PKG_DIR}/usr/share/msedit-plugin/
          chmod 0755 ${PKG_DIR}/usr/share/msedit-plugin/msedit-backend
          chmod 0755 ${PKG_DIR}/usr/share/msedit-plugin/msedit-wrapper
          chmod 0755 ${PKG_DIR}/usr/share/msedit-plugin/functions

          cp -R page/dist/msedit/. ${PKG_DIR}/var/www/mos-plugins/msedit/
          cp images/msedit.png ${PKG_DIR}/var/www/mos-plugins/msedit/icon.png

          cat > ${PKG_DIR}/DEBIAN/control << EOF
          Package: msedit-plugin
          Version: ${VERSION}-1+mos-plugin
          Architecture: all
          Maintainer: hustyanzu
          Section: utils
          Priority: optional
          Description: MSEdit plugin for MOS
           Simple terminal text editor inspired by the MS-DOS Editor.
          EOF

          cat > ${PKG_DIR}/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          PLG=/boot/optional/plugins/msedit
          SHARE=/usr/share/msedit-plugin
          mkdir -p "$PLG/bin" "$PLG/lib"
          mkdir -p "$PLG/packages"
          if [ ! -f "$PLG/packages/packages" ]; then
            pkg="$(apt-cache search '^libicu[0-9]+$' 2>/dev/null | awk '{print $1}' | sort -V | tail -n1)"
            [ -n "$pkg" ] || pkg=libicu76
            printf '%s\n' "$pkg" > "$PLG/packages/packages"
          fi
          chmod 0755 /usr/bin/plugins/msedit /usr/bin/msedit 2>/dev/null || true
          for f in msedit-backend msedit-wrapper functions; do
            cp -f "$SHARE/$f" "$PLG/$f"
          done
          chmod 0755 "$PLG/msedit-backend" "$PLG/msedit-wrapper" "$PLG/functions" 2>/dev/null || true
          if [ ! -f "$PLG/settings.json" ]; then
            cp -f "$SHARE/settings.json" "$PLG/settings.json"
          fi
          if [ -x "$PLG/bin/msedit" ]; then
            install -m 0755 "$PLG/bin/msedit" /usr/bin/msedit.real
          fi
          if [ ! -e /usr/bin/edit ]; then
            ln -sf msedit /usr/bin/edit
          fi
          exit 0
          EOF
          chmod 0755 ${PKG_DIR}/DEBIAN/postinst

          cat > ${PKG_DIR}/DEBIAN/postrm << 'EOF'
          #!/bin/bash
          rm -f /usr/bin/msedit.real
          if [ -L /usr/bin/edit ] && [ "$(readlink /usr/bin/edit)" = "msedit" ]; then
            rm -f /usr/bin/edit
          fi
          exit 0
          EOF
          chmod 0755 ${PKG_DIR}/DEBIAN/postrm

      - name: Build .deb package
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          PKG_NAME="msedit-${VERSION}-1+mos-plugin"
          PKG_DIR="${PKG_NAME}_all"
          DEB_FILE="${PKG_NAME}_all.deb"

          dpkg-deb --build --root-owner-group ${PKG_DIR} ${DEB_FILE}
          md5sum ${DEB_FILE} | awk '{print $1}' > ${DEB_FILE}.md5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: MSEdit ${{ steps.version.outputs.VERSION }}
          body: |
            ## MSEdit MOS plugin ${{ steps.version.outputs.VERSION }}

            Install the plugin from the MOS Hub, then click **Install** on the plugin page.
            MSEdit is downloaded from Microsoft's GitHub releases.
          files: |
            msedit-${{ steps.version.outputs.VERSION }}-1+mos-plugin_all.deb
            msedit-${{ steps.version.outputs.VERSION }}-1+mos-plugin_all.deb.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}